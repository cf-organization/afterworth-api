name: CI

# The repository had no CI before this change: the only checks on a PR were Vercel's deployment
# ones, which build but never run a test or look for a leaked credential. Adding invitation
# delivery — which handles a provider API key and mints invitation tokens — is the wrong moment to
# keep relying on that.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The deployment-budget and "resolve is unchanged" audits diff against origin/main.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Tests
        run: npm test

      # ★ THE AUTHORIZATION SUITE RUNS THE REAL is_estate_owner AGAINST A REAL POSTGRES, under
      # `SET ROLE authenticated` so RLS is actually enforced. It is a separate step from `npm test`
      # because it needs a database, and because a failure here means something categorically worse
      # than a unit-test failure.
      #
      # It exits 2 — not 0 — when it cannot reach a database, so a runner without Docker FAILS the
      # job rather than reporting a green "authorization verified" that inspected nothing.
      - name: SQL authorization suite
        run: npm run test:sql-auth

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pattern scan for the credential shapes this project actually handles. Deliberately not a
      # generic entropy scanner: those drown a small repo in false positives and get ignored, which
      # is worse than no scan. test/ is excluded only for the `re_` fixture, which is a literal
      # non-key string asserted on by the provider tests.
      - name: Scan for credential shapes
        run: |
          set -uo pipefail
          fail=0
          scan() {
            local label="$1" pattern="$2"
            local hits
            # package-lock.json is excluded: it is full of base64 sha512 integrity hashes, which
            # collide with token shapes and produce noise no reviewer will keep reading.
            hits=$(git grep -nIE "$pattern" -- . ':!test/**' ':!package-lock.json' ':!.github/workflows/ci.yml' || true)
            if [ -n "$hits" ]; then
              echo "::error::possible $label committed:"
              echo "$hits"
              fail=1
            fi
          }
          scan "Resend API key"        're_[A-Za-z0-9]{20,}'
          scan "Supabase secret key"   'sb_secret_[A-Za-z0-9_-]{10,}'
          scan "Supabase service JWT"  'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.'
          scan "Upstash token"         'AY[A-Za-z0-9_-]{30,}'
          scan "generic private key"   'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          exit $fail

      - name: Assert no .env file is tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\..*)?$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::env file is tracked in git: $tracked"
            exit 1
          fi

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # DEPENDENCY VULNERABILITY SCAN — scanning only. It can never change what this repo depends on.
  #
  # A separate job, not a step in `verify`, for the same reason the SQL suite is separate: a failure
  # here means something categorically different from a failing unit test, and it must be readable
  # as such on the PR without opening a log.
  #
  # ★ NO REMEDIATION, ANYWHERE. There is no `npm audit fix`, no `npm update`, no bot, no auto-merge
  #   and no commit, and the enforcing step is not marked continue-on-error and does not end in
  #   `|| true`. Two `git diff --exit-code` guards prove the job left the dependency graph
  #   exactly as committed — one after the install, one after the scan — because a security gate
  #   that can silently rewrite the lockfile is a supply-chain risk rather than a control.
  #
  # ★ THE THRESHOLD IS THE REPOSITORY'S, NOT THE TOOL'S. `npm audit` defaults to failing at `low`;
  #   this gate fails at critical + high and REPORTS everything below, which is the line
  #   docs/phase10-closeout.md already held as a release exit criterion. The decision lives in
  #   scripts/security/vulnerabilityPolicy.mjs, is unit-tested against synthetic reports, and is
  #   byte-identical to afterworth-mobile's copy.
  #
  # ★ `contents: read` AND NOTHING ELSE. The scan reads a lockfile and asks a public advisory
  #   database about it. It has no business holding a token that can write to this repository.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  dependency-scan:
    name: dependency vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` is the FROZEN install: it installs exactly what package-lock.json pins and fails if
      # package.json disagrees with it, rather than resolving anything new. `npm install` here would
      # let the job audit a tree that is not the committed one.
      - run: npm ci

      - name: Assert the frozen install changed nothing
        run: git diff --exit-code

      # Audits the INSTALLED tree, deliberately — `--package-lock-only` was measured against the
      # mobile graph and under-reports, missing six packages including two direct dependencies.
      - name: Dependency vulnerability scan
        run: node scripts/security/dependencyAudit.mjs

      - name: Assert the scan changed nothing
        run: git diff --exit-code
